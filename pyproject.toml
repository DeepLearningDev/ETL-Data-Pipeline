[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "financial-etl-pipeline"
version = "0.1.0"
description = "Interview-ready ETL showcase for ingesting, cleaning, validating, and loading financial data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3.0",
  "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "mypy>=1.10,<2.0",
  "pandas-stubs>=2.2,<3.0",
  "pytest>=8.2,<9.0",
  "ruff>=0.4,<1.0",
]

[project.scripts]
financial-etl = "etl_pipeline.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_pipeline"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
strict_equality = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

